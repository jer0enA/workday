name: Workday
version: "0.3.0"
slug: workday
description: Log your daily hours in 15-minute steps, with week/month overviews and CSV export.
url: https://github.com/jer0enA/workday
arch:
  - amd64
  - aarch64
ingress: true
panel_icon: mdi:clock-outline
panel_title: Workday
panel_admin: false
homeassistant_api: true
hassio_api: true
services:
  - mysql:need
options:
  reminder_enabled: false
  reminder_time: "18:00"
  reminder_days:
    - mon
    - tue
    - wed
    - thu
    - fri
  notify_service: ""
  min_hours: 0
  reminder_user: ""
  skip_entity: ""
schema:
  reminder_enabled: bool
  reminder_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  reminder_days:
    - list(mon|tue|wed|thu|fri|sat|sun)
  notify_service: str?
  min_hours: float(0,24)
  reminder_user: str?
  skip_entity: str?
