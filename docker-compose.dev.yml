# Local development without Home Assistant:
#   docker compose -f docker-compose.dev.yml up --build
#   open http://localhost:8099
services:
  db:
    image: mariadb:11.8.9
    environment:
      MARIADB_DATABASE: workday
      MARIADB_USER: workday
      MARIADB_PASSWORD: workday-dev
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  app:
    build: ./workday
    environment:
      DEV_MODE: "1"
      DATABASE_URL: mysql+pymysql://workday:workday-dev@db:3306/workday?charset=utf8mb4
      TZ: Europe/Amsterdam
    ports:
      - "127.0.0.1:8099:8099"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
