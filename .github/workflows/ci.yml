name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly re-scan for newly published CVEs

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workday/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install (hash-checked)
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: pipx run ruff==0.17.3 check ../..
      - name: Test
        run: python -m pytest -q
      - name: Audit dependencies
        run: pipx run pip-audit==2.10.1 -r requirements.txt --require-hashes --strict

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: workday/Dockerfile
      - name: Lint add-on config
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: ./workday
      - name: Build image
        run: docker build -t workday-addon:ci workday/
      - name: Scan image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: workday-addon:ci
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table
